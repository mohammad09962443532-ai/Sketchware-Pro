name: Build Sketchware APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت سورس
        uses: actions/checkout@v4

      - name: نصب Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: نصب Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37'

      - name: آماده‌سازی Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'

      - name: ساخت APK
        run: gradle :app:assembleDebug --no-daemon

      - name: ذخیره APK
        uses: actions/upload-artifact@v4
        with:
          name: Sketchware-Farsi-APK
          path: app/build/outputs/apk/debug/*.apk
